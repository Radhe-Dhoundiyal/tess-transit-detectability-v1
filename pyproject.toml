[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tess-detectability"
version = "1.0.0rc2"
description = "Evidence-first TESS transit-detectability benchmark"
requires-python = "==3.12.*"
dependencies = [
  "astropy==7.2.2",
  "numpy==1.26.4",
  "pandas==2.2.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
