name: Verify project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install local project
        run: .\.venv\Scripts\python.exe -m pip install --index-url https://pypi.org/simple ".[test]"
      - name: Check dependencies
        run: .\.venv\Scripts\python.exe -m pip check
      - name: Run numerical example
        run: .\.venv\Scripts\python.exe examples/normalize_depth.py
      - name: Run focused tests
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Verify saved records and links
        run: .\.venv\Scripts\python.exe scripts/verify_project.py
